name: Daily Tech & Markets Brief

on:
  schedule:
    # GitHub may delay or silently drop scheduled runs, so there are 3 attempts.
    # The first one that runs sends the email; the others see last_sent.txt and skip.
    - cron: "40 0 * * *" # 06:10 IST
    - cron: "10 1 * * *" # 06:40 IST
    - cron: "40 1 * * *" # 07:10 IST
  workflow_dispatch: # "Run workflow" button: always sends

permissions:
  contents: write # needed to commit last_sent.txt

concurrency:
  group: daily-brief # backup runs wait in line instead of running in parallel
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # latest commit, so we see a last_sent.txt pushed by an earlier run

      - name: Skip if already sent today
        id: check
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(cat last_sent.txt 2>/dev/null)" = "$today" ]; then
            echo "Already sent today, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build and send the brief
        if: steps.check.outputs.skip != 'true'
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      # Record today's send. This daily commit also keeps the repo "active",
      # so GitHub never auto-disables the schedule (it does after 60 idle days).
      - name: Mark as sent
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "${{ steps.check.outputs.today }}" > last_sent.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_sent.txt
          git commit -m "brief sent ${{ steps.check.outputs.today }}" || exit 0
          git pull --rebase && git push
