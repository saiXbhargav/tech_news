name: Daily Tech & Markets Brief

on:
  schedule:
    # 01:15 UTC = 06:45 IST. GitHub cron can run 5-30 min late, so this lands before 7:30 IST.
    - cron: "15 1 * * *"
  workflow_dispatch: # "Run workflow" button for manual tests

permissions:
  contents: write # needed for the keep-alive commit below

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send the brief
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Push an empty commit if the last commit is older than 45 days.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflow alive"
            git push
          fi
